# The ModelBump GitHub Action (ADR 0026). Use it from another repository:
#
#   - uses: imhammad/modelbump@v1
#     with:
#       fail-within: "30"
#
# With `open-prs: "true"` it also opens one "Bump LLM model" pull request per
# retired or retiring model, like Dependabot (ADR 0072). That needs
# `permissions: contents: write, pull-requests: write`.
#
# It installs ModelBump from this repository at the same version, so the
# action and the scanner can never drift apart.
name: ModelBump scan
description: Find the LLM model IDs in your code and config, and warn before providers retire them.
author: Hammad Hassan
branding:
  icon: alert-triangle
  color: orange

inputs:
  path:
    description: Folder to scan, relative to the repository root.
    default: "."
  fail-within:
    description: >-
      Fail the job if a model is retired or shuts down within this many days.
      Leave empty to report without ever failing.
    default: ""
  soon-days:
    description: Mark a model RETIRING_SOON when it shuts down within this many days.
    default: "90"
  exclude:
    description: Paths to skip, one pattern per line (for example `tests` or `*.ipynb`).
    default: ""
  skip-comments:
    description: >-
      Leave out model IDs that only describe a model: comments, docstrings, sentences
      and price tables ("true" or "false").
    default: "false"
  skip-tests:
    description: Leave out test files and test folders ("true" or "false").
    default: "false"
  upload-sarif:
    description: >-
      Upload the findings to GitHub code scanning, so they show in the Security tab.
      Needs `permissions: security-events: write`.
    default: "true"

  open-prs:
    description: >-
      "true" opens one pull request per model that is retired or shuts down within
      `within` days, to the registry's suggested replacement; a model whose branch is
      already there is skipped. "dry-run" only lists them. "false" does neither.
      Needs `permissions: contents: write, pull-requests: write`, and the repository
      setting that lets GitHub Actions create pull requests.
    default: "false"
  within:
    description: With open-prs, bump models that shut down within this many days.
    default: "90"
  github-token:
    description: >-
      Token for opening pull requests. The default GITHUB_TOKEN works, but pull requests
      it opens do not start other workflows; pass a fine-grained token to run CI on them.
    default: ${{ github.token }}

outputs:
  sarif-file:
    description: Path of the SARIF report the action wrote.
    value: ${{ steps.sarif.outputs.file }}
  bump-report:
    description: With open-prs, path of the text report of the bumps (also in the job summary).
    value: ${{ steps.bump.outputs.report }}

runs:
  using: composite
  steps:
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@v10.3.1
      with:
        python-version: "3.12"

    # Inputs reach the script as environment variables, never pasted into the
    # command, so a crafted input cannot run commands.
    - name: Write the SARIF report
      id: sarif
      shell: bash
      env:
        MB_PATH: ${{ inputs.path }}
        MB_SOON_DAYS: ${{ inputs.soon-days }}
        MB_EXCLUDE: ${{ inputs.exclude }}
        MB_SKIP_COMMENTS: ${{ inputs.skip-comments }}
        MB_SKIP_TESTS: ${{ inputs.skip-tests }}
      run: bash "$GITHUB_ACTION_PATH/action/scan.sh" sarif

    - name: Upload to code scanning
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.sarif.outputs.file }}
        category: modelbump

    - name: Check model retirements
      shell: bash
      env:
        MB_PATH: ${{ inputs.path }}
        MB_SOON_DAYS: ${{ inputs.soon-days }}
        MB_EXCLUDE: ${{ inputs.exclude }}
        MB_SKIP_COMMENTS: ${{ inputs.skip-comments }}
        MB_SKIP_TESTS: ${{ inputs.skip-tests }}
        MB_FAIL_WITHIN: ${{ inputs.fail-within }}
      run: bash "$GITHUB_ACTION_PATH/action/scan.sh" check

    - name: Open bump pull requests
      id: bump
      if: ${{ inputs.open-prs == 'true' || inputs.open-prs == 'dry-run' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MB_PATH: ${{ inputs.path }}
        MB_EXCLUDE: ${{ inputs.exclude }}
        MB_WITHIN: ${{ inputs.within }}
        MB_OPEN_PRS: ${{ inputs.open-prs }}
      run: bash "$GITHUB_ACTION_PATH/action/scan.sh" bump
