name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A fine-grained PAT, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN
          # do not trigger CI, so the required checks would never run.
          # See docs/engineering-challenges/001-release-pr-ci-never-runs.md
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The jobs below run only when merging the release PR created a release
  # (ADR 0035).
  build:
    name: Build and check the package
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: Check the version matches the tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "pyproject version: $version, tag: $TAG"
          test "v$version" = "$TAG"
      - name: Build the wheel and source archive
        run: uv build
      - name: Install the wheel in a clean environment and scan the demo app
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          cp -r tests/fixtures/action-demo "$RUNNER_TEMP/demo"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/modelbump" --version
          # The demo app uses retired models, so a working scanner (with its
          # registry data) must fail here.
          if "$RUNNER_TEMP/smoke/bin/modelbump" scan demo --fail-within 30; then
            echo "The installed scanner did not flag the retired models." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this workflow in this environment, so no
    # API token is stored anywhere (ADR 0035).
    environment:
      name: pypi
      url: https://pypi.org/project/modelbump/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
