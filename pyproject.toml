[project]
name = "modelbump"
version = "0.1.0"
description = "Dependabot for LLM models: detect model retirements, test old vs new with statistical rigor, repair prompts, and open the upgrade PR."
readme = "README.md"
authors = [
    { name = "Hammad Hassan" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
modelbump = "modelbump.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]
research = [
    "httpx>=0.28.1",
]

[tool.uv]
# `uv sync` installs the research tools too, locally and in CI.
default-groups = ["dev", "research"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=modelbump --cov=research --cov-report=term-missing"
