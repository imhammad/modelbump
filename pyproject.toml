[project]
name = "modelbump"
version = "0.2.0"
description = "Find the LLM model IDs in your code and config, and warn before providers retire them."
readme = "README.md"
authors = [
    { name = "Hammad Hassan" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["llm", "model deprecation", "model retirement", "static analysis", "github action", "openai", "anthropic", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/imhammad/modelbump"
Documentation = "https://imhammad.github.io/modelbump/"
Repository = "https://github.com/imhammad/modelbump"
Issues = "https://github.com/imhammad/modelbump/issues"
Changelog = "https://github.com/imhammad/modelbump/blob/main/CHANGELOG.md"

[project.scripts]
modelbump = "modelbump.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]
research = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
]

[tool.uv]
# `uv sync` installs the research tools too, locally and in CI.
default-groups = ["dev", "research"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "research"]
exclude = ["^research/data/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=modelbump --cov=research --cov-report=term-missing"
