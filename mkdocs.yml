site_name: ModelBump
site_description: Dependabot for LLM models.
site_url: https://imhammad.github.io/modelbump/
repo_url: https://github.com/imhammad/modelbump
repo_name: imhammad/modelbump
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Hammad Hassan. Apache-2.0.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Architecture:
      - architecture/index.md
  - Decisions (ADRs):
      - adr/index.md
      - adr/0001-python-uv-src-layout.md
      - adr/0002-apache-2-license.md
      - adr/0003-git-workflow.md
      - adr/0004-docs-with-material-for-mkdocs.md
  - Engineering challenges:
      - engineering-challenges/index.md
  - Dev journal:
      - journal/index.md
      - journal/2026-10-07.md
  - Research:
      - research/index.md
