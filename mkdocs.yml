site_name: ModelBump
site_description: Dependabot for LLM models.
site_url: https://imhammad.github.io/modelbump/
repo_url: https://github.com/imhammad/modelbump
repo_name: imhammad/modelbump
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Hammad Hassan. Apache-2.0.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Architecture:
      - architecture/index.md
      - architecture/registry.md
  - Decisions (ADRs):
      - adr/index.md
      - adr/0001-python-uv-src-layout.md
      - adr/0002-apache-2-license.md
      - adr/0003-git-workflow.md
      - adr/0004-docs-with-material-for-mkdocs.md
      - adr/0005-releases-with-release-please.md
      - adr/0006-retirement-registry-format.md
      - adr/0007-rescheduled-retirements.md
      - adr/0008-research-code-separate-from-product.md
      - adr/0009-mining-method.md
      - adr/0010-hybrid-search-for-huge-ids.md
      - adr/0011-search-huge-ids-from-the-notice.md
      - adr/0012-migration-filter-as-flags.md
      - adr/0013-validation-sample.md
      - adr/0014-filter-rules-v2.md
      - adr/0015-fresh-sample-for-rules-v2.md
      - adr/0016-migration-timing.md
      - adr/0017-lag-and-migration-targets.md
      - adr/0018-changed-files-sample.md
      - adr/0019-paper-numbers-from-one-script.md
      - adr/0020-dataset-release-package.md
      - adr/0021-robustness-checks.md
      - adr/0022-paper-in-latex.md
  - Engineering challenges:
